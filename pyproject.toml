[project]
name = "hrec"
version = "0.1.0"
description = "Two-stage hybrid recommender (EASE / LightGCN / SASRec retrieval + LambdaRank ranking) with leakage-safe evaluation"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "torch", "lightgbm", "hnswlib", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
